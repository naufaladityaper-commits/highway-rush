
<!DOCTYPE html>

<head>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;

}

button {
  border: 0;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  touch-action: manipulation;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: flex;
}

#introScreen {
  background:
    radial-gradient(circle at center, #202b3e 0%, #080b12 65%);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  z-index: 20;
}

.intro-title {
  font-size: clamp(38px, 12vw, 65px);
  font-weight: 1000;
  letter-spacing: 5px;
  color: white;
  text-shadow: 0 0 25px #ff6b22;
}

.intro-title span {
  display: inline-block;
  opacity: 0;
  animation: letterIn .35s forwards;
}

@keyframes letterIn {
  from {
    opacity: 0;
    transform: translateY(30px) scale(.7);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.presents {
  margin-top: 15px;
  color: #ff792d;
  letter-spacing: 8px;
  font-size: 15px;
  opacity: 0;
  animation: presentIn 1s forwards;
  animation-delay: 1.3s;
}

@keyframes presentIn {
  from { opacity: 0; letter-spacing: 15px; }
  to { opacity: 1; letter-spacing: 8px; }
}

.loading {
  width: 190px;
  height: 4px;
  background: #252b37;
  margin-top: 35px;
  border-radius: 10px;
  overflow: hidden;
}

.loading div {
  height: 100%;
  width: 0;
  background: #ff762c;
  animation: loading 2.5s linear forwards;
}

@keyframes loading {
  to { width: 100%; }
}

#menuScreen {
  background:
    linear-gradient(180deg, rgba(5,8,14,.45), #080b12 95%),
    radial-gradient(circle at 50% 25%, #34465b, #080b12 70%);
  flex-direction: column;
  align-items: center;
  justify-content: center;

}

.menu-road {
  position: absolute;

}

    transparent 45px 90px
  );

.menu-road::before { left: 33%; }
.menu-road::after { right: 33%; }

.hidden {

<script>
"use strict";

/* =========================
   SCREEN SYSTEM
========================= */

const screens = document.querySelectorAll(".screen");

function showScreen(id) {
  screens.forEach(screen => screen.classList.remove("active"));
  const target = document.getElementById(id);
  if (target) target.classList.add("active");
}

/* =========================
   INTRO SYSTEM
========================= */

const introText = "ADIT ®";
const introTitle = document.getElementById("introTitle");

introText.split("").forEach((letter, index) => {
  const span = document.createElement("span");
  span.textContent = letter === " " ? "\u00a0" : letter;
  span.style.animationDelay = (index * 0.16) + "s";
  introTitle.appendChild(span);
});

let introFinished = false;

function finishIntro() {
  if (introFinished) return;
  introFinished = true;
  showScreen("menuScreen");
}

setTimeout(finishIntro, 3800);

/* =========================
   AUDIO SYSTEM
========================= */

let audioContext = null;
let soundEnabled = true;
let musicEnabled = true;
let musicTimer = null;
let musicStep = 0;

function initAudio() {
  if (!audioContext) {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (AudioContextClass) {
      audioContext = new AudioContextClass();
    }
  }

  if (audioContext && audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function tone(frequency, duration, type = "sine", volume = 0.04) {
  if (!soundEnabled || !audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(volume, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration);
}

function playSound(type) {
  if (!soundEnabled) return;
  initAudio();

  switch (type) {
    case "click":
      tone(520, .08, "square", .025);
      break;
    case "start":
      tone(330, .12);
      setTimeout(() => tone(520, .16), 120);
      break;
    case "lane":
      tone(260, .06, "sine", .02);
      break;
    case "skill":
      tone(440, .12, "triangle");
      setTimeout(() => tone(700, .18, "triangle"), 100);
      break;
    case "crash":
      tone(110, .35, "sawtooth", .06);
      break;
    case "finish":
      tone(440, .15);
      setTimeout(() => tone(550, .15), 150);
      setTimeout(() => tone(660, .3), 300);
      break;
    case "pause":
      tone(220, .1);
      break;
  }
}

/* Musik sintetis original, tanpa file musik eksternal */
const musicNotes = [220, 261, 329, 261, 196, 246, 293, 246];

function startMusic() {
  if (!musicEnabled || musicTimer) return;
  initAudio();
  if (!audioContext) return;

  musicTimer = setInterval(() => {
    if (!musicEnabled || !audioContext) return;
    if (audioContext.state !== "running") return;

    const note = musicNotes[musicStep % musicNotes.length];
    musicStep++;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.value = note;
    gain.gain.value = .018;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .25
    );
    oscillator.stop(audioContext.currentTime + .25);
  }, 300);
}

function stopMusic() {
  if (musicTimer) {
    clearInterval(musicTimer);
    musicTimer = null;
  }
}

/* =========================
   SETTINGS
========================= */

const soundButton = document.getElementById("soundButton");
const musicButton = document.getElementById("musicButton");

function updateSettings() {
  soundButton.textContent = "SOUND: " + (soundEnabled ? "ON" : "OFF");
  musicButton.textContent = "MUSIC: " + (musicEnabled ? "ON" : "OFF");
}

soundButton.addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  updateSettings();
  if (soundEnabled) playSound("click");
});

musicButton.addEventListener("click", () => {
  musicEnabled = !musicEnabled;

  if (musicEnabled) startMusic();
  else stopMusic();

  updateSettings();
});

/* =========================
   HIGH SCORE
========================= */

let bestScore = Number(localStorage.getItem("hrBest") || 0);

function updateBestScore() {
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("hrBest", String(bestScore));
  }

  document.getElementById("bestScoreDisplay").textContent = bestScore;
}

/* =========================
   GAME VARIABLES
========================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = rect.width;
  H = rect.height;

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);

let running = false;
let paused = false;
let score = 0;
let speed = 1;
let roadOffset = 0;
let spawnTimer = 0;
let lastFrame = 0;
let animationFrame = null;

const lanes = [0, 1, 2];

let player = {
  lane: 1,
  x: 0,
  y: 0,
  width: 39,
  height: 68
};

let obstacles = [];
let trees = [];
let tireMarks = [];

/* =========================
   SKILL SYSTEM
========================= */

const SKILL_UNLOCK_SCORE = 150;
const SKILL_COOLDOWN = 90;

const skillInfo = {
  mega: { duration: 50, label: "MEGA CAR" },
  fly: { duration: 40, label: "FLY" },
  slow: { duration: 60, label: "SLOW TIME" }
};

let activeSkill = null;
let skillEndTime = 0;
let cooldownEndTime = 0;

const skillButtons = {
  mega: document.getElementById("megaSkill"),
  fly: document.getElementById("flySkill"),
  slow: document.getElementById("slowSkill")
};

function activateSkill(type) {
  if (!running || paused) return;
  if (score < SKILL_UNLOCK_SCORE) return;
  if (activeSkill) return;
  if (Date.now() < cooldownEndTime) return;

  activeSkill = type;
  skillEndTime = Date.now() + skillInfo[type].duration * 1000;

  playSound("skill");
  updateSkillUI();
}

function endSkill() {
  if (!activeSkill) return;

  activeSkill = null;
  cooldownEndTime = Date.now() + SKILL_COOLDOWN * 1000;
  updateSkillUI();
}

function updateSkillUI() {
  const status = document.getElementById("skillStatus");
  const unlocked = score >= SKILL_UNLOCK_SCORE;
  const cooling = Date.now() < cooldownEndTime;

  Object.keys(skillButtons).forEach(type => {
    const button = skillButtons[type];
    const active = activeSkill === type;

    button.disabled = !unlocked || !!activeSkill || cooling;
    button.classList.toggle(
      "ready",
      unlocked && !activeSkill && !cooling
    );

    if (active) {
      button.innerHTML =
        skillInfo[type].label + "<br>ACTIVE";
    } else {
      const icons = {
        mega: "🚘",
        fly: "✈️",
        slow: "⏳"
      };

      button.innerHTML =
        icons[type] + "<br>" + skillInfo[type].label;
    }
  });

  if (!unlocked) {
    status.textContent =
      "SKILL TERBUKA DI SKOR " + SKILL_UNLOCK_SCORE;
  } else if (activeSkill) {
    const remaining = Math.max(
      0,
      Math.ceil((skillEndTime - Date.now()) / 1000)
    );
    status.textContent =
      skillInfo[activeSkill].label + " • " + remaining + "s";
  } else if (cooling) {
    const remaining = Math.ceil(
      (cooldownEndTime - Date.now()) / 1000
    );
    status.textContent = "COOLDOWN • " + remaining + "s";
  } else {
    status.textContent = "SKILLS READY";
  }
}

skillButtons.mega.addEventListener("click", () => activateSkill("mega"));
skillButtons.fly.addEventListener("click", () => activateSkill("fly"));
skillButtons.slow.addEventListener("click", () => activateSkill("slow"));

/* =========================
   ROAD AND DRAWING
========================= */

function roadBounds() {
  const roadWidth = Math.min(W * .72, 420);
  return {
    left: (W - roadWidth) / 2,
    width: roadWidth,
    right: (W + roadWidth) / 2
  };
}

function laneCenter(lane) {
  const road = roadBounds();
  return road.left + road.width * ((lane + .5) / 3);
}

function drawRoad(delta) {
  const road = roadBounds();

  ctx.fillStyle = "#15291d";
  ctx.fillRect(0, 0, W, H);

  // Road surface
  ctx.fillStyle = "#282e38";
  ctx.fillRect(road.left, 0, road.width, H);

  // Road edges
  ctx.fillStyle = "#ff762c";
  ctx.fillRect(road.left - 4, 0, 4, H);
  ctx.fillRect(road.right, 0, 4, H);

  // Road lane markings
  roadOffset += delta * speed * 0.32;

  ctx.fillStyle = "#dce0e6";

  for (let i = 1; i <= 2; i++) {
    const x = road.left + road.width * i / 3;

    for (let y = -70 + (roadOffset % 70); y < H; y += 70) {
      ctx.fillRect(x - 2, y, 4, 35);
    }
  }

  // Roadside grass stripes
  ctx.fillStyle = "#1b3525";

  for (let y = -40 + (roadOffset % 80); y < H; y += 80) {
    ctx.fillRect(0, y, road.left - 5, 3);
    ctx.fillRect(road.right + 5, y, W - road.right, 3);
  }
}

function drawTree(x, y, size) {
  ctx.fillStyle = "#50351f";
  ctx.fillRect(x - size * .12, y, size * .24, size * .7);

  ctx.fillStyle = "#1e6738";
  ctx.beginPath();
  ctx.arc(x, y, size * .48, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#2d8b49";
  ctx.beginPath();
  ctx.arc(x - size * .15, y - size * .12, size * .28, 0, Math.PI * 2);
  ctx.fill();
}

function drawCar(x, y, width, height, color, isPlayer = false) {
  ctx.save();
  ctx.translate(x, y);

  if (activeSkill === "mega" && isPlayer) {
    ctx.scale(1.3, 1.3);
  }

  if (isPlayer && activeSkill === "fly") {
    ctx.shadowColor = "#54d9ff";
    ctx.shadowBlur = 20;
    ctx.translate(0, -17);
  }

  // Car shadow
  ctx.fillStyle = "#0008";
  ctx.fillRect(-width / 2 + 3, -height / 2 + 5, width, height);

  // Wheels
  ctx.fillStyle = "#090b10";
  ctx.fillRect(-width / 2 - 3, -height / 2 + 12, 6, 16);
  ctx.fillRect(width / 2 - 3, -height / 2 + 12, 6, 16);

  <div class="hud">
    <div class="hud-card">

      <div class="hud-number" id="scoreDisplay">0</div>
    </div>

    <div class="hud-card">
      <div class="hud-title">SPEED</div>

<script>
/* =========================
   HIGHWAY RUSH GAME ENGINE
========================= */

const $ = id => document.getElementById(id);

const screenIDs = [
  "introScreen", "menuScreen", "highScoreScreen",
  "settingsScreen", "gameScreen", "pauseScreen",
  "gameOverScreen", "finishScreen"
];

function showScreen(id) {
  screenIDs.forEach(name => $(name).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

/* =========================
   SOUND ENGINE - OFFLINE
========================= */

let soundOn = localStorage.getItem("hrSound") !== "off";
let audio = null;

function initAudio() {
  if (!audio) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audio = new AudioContextClass();
  }

  if (audio && audio.state === "suspended") {
    audio.resume();
  }
}

function tone(freq, duration, type = "sine", volume = .07, endFreq = null) {
  if (!soundOn) return;

  initAudio();
  if (!audio) return;

  const osc = audio.createOscillator();
  const gain = audio.createGain();

  const now = audio.currentTime;

  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);

  if (endFreq) {
    osc.frequency.exponentialRampToValueAtTime(
      Math.max(1, endFreq), now + duration
    );
  }

  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(.001, now + duration);

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start(now);
  osc.stop(now + duration);
}

function playSound(name) {
  if (!soundOn) return;

  switch (name) {
    case "click":
      tone(500, .07, "square", .035, 700);
      break;

    case "start":
      tone(300, .12, "sawtooth", .05, 650);
      setTimeout(() => tone(650, .16, "sawtooth", .04, 950), 120);
      break;

    case "lane":
      tone(260, .07, "triangle", .035, 180);
      break;

    case "skill":
      tone(300, .3, "sawtooth", .06, 900);
      setTimeout(() => tone(850, .15, "sine", .04, 1200), 150);
      break;

    case "crash":
      tone(180, .35, "sawtooth", .08, 45);
      setTimeout(() => tone(90, .2, "square", .04, 35), 100);
      break;

    case "finish":
      tone(440, .2, "triangle", .06, 660);
      setTimeout(() => tone(660, .2, "triangle", .06, 880), 200);
      setTimeout(() => tone(880, .4, "triangle", .06, 1200), 400);
      break;

    case "pause":
      tone(400, .1, "sine", .04, 250);
      break;
  }
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem("hrSound", soundOn ? "on" : "off");
  updateSoundButton();

  if (soundOn) playSound("click");

/* =========================

const canvas = $("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let roadWidth = 0;
let laneWidth = 0;
let roadLeft = 0;

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";

window.addEventListener("resize", resizeCanvas);

/* =========================

========================= */

let running = false;
let paused = false;

let score = 0;

let trees = [];

};

const unlockScore = 150;

/* =========================

========================= */

function startGame() {
  initAudio();
  playSound("start");

  score = 0;

  playerLane = 1;
  playerX = roadLeft + laneWidth * 1.5;
  playerY = H - 170;

  obstacles = [];

  lastTime = performance.now();

}

/* =========================
   STEERING
========================= */

function changeLane(direction) {
  if (!running || paused) return;

  const oldLane = playerLane;

  playerLane = Math.max(0, Math.min(2, playerLane + direction));

  if (oldLane !== playerLane) {
    tireMarks.push({
      x: playerX,
      y: playerY + 25,
      life: 1
    });

    playSound("lane");
  }
}

$("leftBtn").addEventListener("pointerdown", e => {

document.addEventListener("keydown", e => {

    changeLane(-1);

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
    changeLane(1);
  }

  if (e.key === "Escape" && running) {
    paused ? resumeGame() : pauseGame();
  }
});

/* =========================
   SKILLS
========================= */

function useSkill(type) {
  if (!running || paused) return;
  if (score < unlockScore) return;
  if (activeSkill) return;
  if (performance.now() < cooldownEnd) return;

  activeSkill = type;
  skillEnd = performance.now() + skillDuration[type];

  playSound("skill");
  updateHUD();
}

function endSkill() {
  if (!activeSkill) return;

  activeSkill = null;
  cooldownEnd = performance.now() + cooldownDuration;
  updateHUD();
}

function updateSkills() {
  const now = performance.now();

  if (activeSkill && now >= skillEnd) {
    endSkill();
  }

  const unlocked = score >= unlockScore;
  const cooling = now < cooldownEnd;

  ["mega", "fly", "slow"].forEach(type => {
    const btn = $(type + "Btn");
    const status = $(type + "Status");

    btn.classList.toggle("active", activeSkill === type);

    btn.disabled =
      !unlocked ||
      !!activeSkill ||
      cooling ||
      !running ||
      paused;

    if (!unlocked) {
      status.textContent = "UNLOCK 150";
    } else if (activeSkill === type) {
      status.textContent = Math.ceil((skillEnd - now) / 1000) + " SEC";
    } else if (activeSkill) {
      status.textContent = "IN USE";
    } else if (cooling) {
      status.textContent = "COOLDOWN " +
        Math.ceil((cooldownEnd - now) / 1000) + "s";
    } else {
      status.textContent = "READY";
    }
  });
}

}

function beep(frequency = 400, duration = .1) {
  if (!soundEnabled) return;

  try {
    audioContext ||= new (window.AudioContext || window.webkitAudioContext)();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.frequency.value = frequency;
    oscillator.type = "sine";
    gain.gain.setValueAtTime(.08, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + duration);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (error) {}
}

updateSoundButton();

function changeLane(direction) {

    });

$("leftBtn").addEventListener("pointerdown", () => changeLane(-1));
$("rightBtn").addEventListener("pointerdown", () => changeLane(1));

document.addEventListener("keydown", event => {

function useSkill(type) {

  if (score < SKILL_UNLOCK_SCORE) return;
  if (activeSkill || performance.now() < cooldownEnd) return;

  activeSkill = type;

      status.textContent = "IN USE";

/* SPAWNING */

function spawnObstacle() {
  const lane = Math.floor(Math.random() * 3);

  obstacles.push({
    lane,
    x: roadLeft + laneWidth * (lane + .5),
    y: -90,
    width: 34,
    height: 58,
    color: ["#d84a35", "#3b91d8", "#e0b33f"][Math.floor(Math.random() * 3)]
  });
}

function spawnTree() {
  const side = Math.random() < .5 ? -1 : 1;

  trees.push({
    x: side < 0 ? roadLeft - 25 : roadLeft + roadWidth + 25,
    y: -35,
    size: 12 + Math.random() * 12
  });
}

/* DRAW ROAD */

function drawRoad() {
  ctx.fillStyle = "#101b13";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#30343a";
  ctx.fillRect(roadLeft, 0, roadWidth, H);

  ctx.fillStyle = "#f4f0df";
  ctx.fillRect(roadLeft + 5, 0, 3, H);
  ctx.fillRect(roadLeft + roadWidth - 8, 0, 3, H);

  ctx.strokeStyle = "#aeb4ba";
  ctx.lineWidth = 3;
  ctx.setLineDash([30, 25]);

  ctx.lineDashOffset = -roadOffset;

  for (let i = 1; i <= 2; i++) {
    const x = roadLeft + laneWidth * i;

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  ctx.setLineDash([]);

  roadOffset += speed * 5;

  if (roadOffset > 55) roadOffset = 0;
}

/* DRAW TREES */

function drawTrees(dt) {
  if (Math.random() < .045) spawnTree();

  trees.forEach(tree => {
    tree.y += speed * 4 * dt;

    ctx.fillStyle = "#633d21";
    ctx.fillRect(tree.x - 3, tree.y, 6, 18);

    ctx.fillStyle = "#207b3d";
    ctx.beginPath();
    ctx.arc(tree.x, tree.y, tree.size, 0, Math.PI * 2);
    ctx.fill();
  });

  trees = trees.filter(tree => tree.y < H + 50);
}

/* DRAW CARS */

function drawCar(x, y, color, isPlayer = false) {
  const width = isPlayer && activeSkill === "mega" ? 48 : 34;
  const height = isPlayer && activeSkill === "mega" ? 72 : 56;

  if (isPlayer && activeSkill === "fly") {
    y -= 35;
  }

  ctx.fillStyle = "#08090b";
  ctx.fillRect(x - width / 2 - 4, y + 9, 5, height - 16);
  ctx.fillRect(x + width / 2 - 1, y + 9, 5, height - 16);

  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x - width / 2, y, width, height, 8);
  ctx.fill();

  ctx.fillStyle = "#b7d8ed";
  ctx.fillRect(x - width / 2 + 5, y + 9, width - 10, 13);

  ctx.fillStyle = "#111820";
  ctx.fillRect(x - width / 2 + 5, y + 29, width - 10, 14);

  ctx.fillStyle = "#ffdf75";
  ctx.fillRect(x - width / 2 + 4, y + height - 7, 7, 4);
  ctx.fillRect(x + width / 2 - 11, y + height - 7, 7, 4);

  if (isPlayer && activeSkill === "mega") {
    ctx.strokeStyle = "#ff9500";
    ctx.lineWidth = 3;
    ctx.strokeRect(x - width / 2 - 4, y - 4, width + 8, height + 8);
  }
}

/* TIRE MARKS */

function drawTireMarks(dt) {
  tireMarks.forEach(mark => {
    mark.life -= .018 * dt;

    ctx.fillStyle = `rgba(10,10,10,${Math.max(0, mark.life * .5)})`;
    ctx.fillRect(mark.x - 12, mark.y, 4, 20);
    ctx.fillRect(mark.x + 8, mark.y, 4, 20);
  });

  tireMarks = tireMarks.filter(mark => mark.life > 0);
}

/* COLLISION */

function checkCollision(obstacle) {
  const playerWidth = activeSkill === "mega" ? 48 : 34;

  const playerLeft = playerX - playerWidth / 2;
  const playerRight = playerX + playerWidth / 2;
  const playerTop = player.y;
  const playerBottom = player.y + player.height;

  const hit =
    playerLeft < obstacle.x + obstacle.width / 2 &&
    playerRight > obstacle.x - obstacle.width / 2 &&
    playerTop < obstacle.y + obstacle.height &&
    playerBottom > obstacle.y;

  return hit;
}

/* HUD */

function updateHUD() {
  $("scoreDisplay").textContent = Math.floor(score);
  $("speedDisplay").textContent = speed.toFixed(1);

  updateSkills();
}

/* GAME LOOP */

function gameLoop(now) {
  if (!running || paused) return;

  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;

  const slow = activeSkill === "slow";
  const gameSpeed = slow ? .45 : 1;

  speed = 1 + Math.min(score / 250, 3);

  score += .35 * gameSpeed * dt;

  if (score >= 1000) {
    score = 1000;
    finishGame();
    return;
  }

  player.y = H - 170;

  const targetX = roadLeft + laneWidth * (playerLane + .5);
  playerX += (targetX - playerX) * .25;

  drawRoad();
  drawTrees(dt * gameSpeed);
  drawTireMarks(dt);

  spawnTimer += dt * gameSpeed;

  if (spawnTimer > Math.max(25, 75 - speed * 9)) {
    spawnObstacle();
    spawnTimer = 0;
  }

  obstacles.forEach(obstacle => {
    obstacle.y += speed * 4.2 * gameSpeed * dt;

    drawCar(obstacle.x, obstacle.y, obstacle.color);

    if (checkCollision(obstacle)) {
      if (activeSkill === "mega" || activeSkill === "fly") {
        obstacle.y = H + 100;
        beep(180, .08);
      } else {
        endGame();
      }
    }
  });

  obstacles = obstacles.filter(obstacle => obstacle.y < H + 100);

  drawCar(playerX, player.y, "#ff8500", true);

  updateHUD();

  requestAnimationFrame(gameLoop);
}

 ctx.fillStyle="#eee";
 for(let y=-80;y<600;y+=80){

 }

 tireMarks.forEach(mark=>{

 });

/* UPDATE */
function spawnObstacle(){
 const l=Math.floor(Math.random()*3);
 obstacles.push({x:lanes[l],y:-50,passed:false});
}

function update(dt){
 const step=dt/16;
 const slowActive=skills.slow>0;
 const currentSpeed=slowActive?3:speed;

 roadOffset=(roadOffset+currentSpeed*step)%80;

 // Skill countdown and shared cooldown
 if(activeSkill!==null){
  skills[activeSkill]=Math.max(0,skills[activeSkill]-dt/1000);

   activeSkill=null;
   globalCooldown=90;
  }
 }else if(globalCooldown>0){
  globalCooldown=Math.max(0,globalCooldown-dt/1000);
 }

 playerX+=(lanes[lane]-playerX)*Math.min(1,dt/75);

 trees.forEach(t=>{
  t.y+=currentSpeed*step;
  if(t.y>590){
   t.y=-30;
   t.x=Math.random()<.5?35:355;
  }
 });

 tireMarks.forEach(m=>{
  m.y+=currentSpeed*step;
  m.life-=dt/5000;
 });
 tireMarks=tireMarks.filter(m=>m.life>0);

 spawnTimer+=dt;
 if(spawnTimer>Math.max(450,1050-score*2)){
  spawnObstacle();
  spawnTimer=0;
 }

 const playerY=skills.fly>0?425:455;

 for(const o of obstacles){
  o.y+=currentSpeed*step;
  const close=Math.abs(o.y-playerY)<34&&Math.abs(o.x-playerX)<35;

  if(close){
   if(skills.mega>0){
    o.y=700;
    score+=5;
   }else if(skills.fly<=0){
    endGame();
    return;
   }
  }

  if(o.y>580&&!o.passed){
   o.passed=true;
   score++;
  }
 }

 obstacles=obstacles.filter(o=>o.y<620);

 if(!slowActive)speed=3+score*.035;

 document.getElementById("score").textContent=score;
 document.getElementById("speed").textContent=(currentSpeed/3).toFixed(1)+"x";

 updateSkillButtons();

 if(score>=1000){
  finishGame();
  return;
 }
}

function draw(){
 drawRoad();

 obstacles.forEach(o=>drawCar(o.x,o.y,"#e64b42"));

 if(skills.fly>0){
  ctx.globalAlpha=.25;
  drawCar(playerX,465,"#111");
  ctx.globalAlpha=1;
 }

 const size=skills.mega>0?1.55:1;
 const playerY=skills.fly>0?425:455;

 drawCar(playerX,playerY,skills.mega>0?"#ffb52e":"#168de0",size);

 if(skills.fly>0){
  ctx.fillStyle="white";
  ctx.font="bold 14px Arial";
  ctx.fillText("FLYING",playerX-25,playerY-35);
 }
 if(skills.mega>0){
  ctx.fillStyle="#ffdb69";
  ctx.font="bold 12px Arial";
  ctx.fillText("MEGA",playerX-20,playerY-40);
 }
}

function updateSkillButtons(){
 const names=["mega","fly","slow"];
 const labels={
  mega:"🚙 MEGA CAR",
  fly:"✈️ FLY",
  slow:"🐢 SLOW TIME"
 };

 names.forEach(name=>{
  const b=document.getElementById(name);

  if(score<150){
   b.disabled=true;
   b.innerHTML=labels[name]+"<br>🔒 SCORE 150";
  }else if(activeSkill===name){
   b.disabled=true;
   b.innerHTML=labels[name]+"<br>AKTIF "+Math.ceil(skills[name])+"s";
  }else if(activeSkill!==null){
   b.disabled=true;
   b.innerHTML=labels[name]+"<br>SKILL LAIN AKTIF";
  }else if(globalCooldown>0){
   b.disabled=true;
   b.innerHTML=labels[name]+"<br>COOLDOWN "+Math.ceil(globalCooldown)+"s";
  }else{
   b.disabled=false;
   b.innerHTML=labels[name]+"<br>SIAP!";
  }
 });
}

/* GAME LOOP */
function loop(time){
 if(!running)return;
 const dt=lastTime?Math.min(time-lastTime,40):16;
 lastTime=time;

 update(dt);
 if(!running)return;

 draw();
 requestAnimationFrame(loop);
}

/* GAME OVER */
function saveBest(){
 if(score>bestScore){
  bestScore=score;
  localStorage.setItem("hrBest",String(bestScore));
 }
 document.getElementById("best").textContent=bestScore;
}

function endGame(){
 running=false;
 saveBest();
 playBeep(150,.5);

 document.getElementById("finalScore").textContent=score;
 document.getElementById("finalBest").textContent=bestScore;
 showScreen("gameOverScreen");
}

/* FINISH */
function finishGame(){
 running=false;
 score=1000;
 saveBest();
 playBeep(900,.4);

 document.getElementById("finishScreen").classList.remove("hidden");

 const flash=document.getElementById("flash");
 flash.style.opacity="1";
 setTimeout(()=>flash.style.opacity="0",120);
}

/* KEYBOARD */
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
 if(e.key==="1")activateSkill("mega");
 if(e.key==="2")activateSkill("fly");
 if(e.key==="3")activateSkill("slow");
});

/* SWIPE */
let touchStart=null;
canvas.addEventListener("touchstart",e=>{
 touchStart=e.touches[0].clientX;
},{passive:true});

canvas.addEventListener("touchend",e=>{
 if(touchStart===null)return;
 const delta=e.changedTouches[0].clientX-touchStart;
 if(Math.abs(delta)>25)move(delta>0?1:-1);
 touchStart=null;
},{passive:true});

updateSkillButtons();
</script>
</body>
  </html>
