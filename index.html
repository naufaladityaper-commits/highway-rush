
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Highway Rush</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1420;color:white;font-family:Arial;text-align:center}
main{max-width:450px;margin:auto;padding:12px}
h2{margin:8px}
.game{position:relative}
canvas{width:100%;display:block;border-radius:15px;background:#263b35;touch-action:none}
.hud{position:absolute;top:10px;left:10px;background:#07111ddd;padding:7px 12px;border-radius:9px;text-align:left}
.hud small{display:block;font-size:10px;color:#b9c8d8}
.hud b{font-size:20px}
.speed{position:absolute;right:10px;top:10px;background:#07111ddd;padding:8px;border-radius:9px;font-size:12px}
.overlay{position:absolute;inset:0;background:#07131bdd;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;gap:12px;border-radius:15px}
.overlay h1{margin:0}
button{border:0;border-radius:12px;background:#1686e8;color:white;font-size:23px;font-weight:bold;padding:14px;cursor:pointer}
#start{font-size:16px;padding:12px 25px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.controls button{background:#182b40;border:1px solid #40536a;height:65px}
</style>
</head>
<body>
<main>
<h2>🏎️ HIGHWAY RUSH</h2>
<div class="game">
<canvas id="c" width="390" height="560"></canvas>
<div class="hud"><small>SCORE</small><b id="score">0</b></div>
<div class="speed" id="speed">SPEED 1.0x</div>
<div class="overlay" id="overlay">
<h1>🏁 HIGHWAY RUSH</h1>
<p>Hindari mobil dan pecahkan rekor!</p>
<button id="start">MULAI MAIN</button>
<small>Geser layar atau gunakan tombol</small>
</div>
</div>
<div class="controls">
<button id="left">⬅</button>
<button id="right">➡</button>
</div>
</main>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=390,H=560,lanes=[91,195,299];
let lane=1,score=0,speed=3.2,obstacles=[],particles=[];
let running=false,frame=0,road=0,last=0,raf;

function car(x,y,color){
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle='#111';ctx.fillRect(-23,-22,8,17);
 ctx.fillRect(15,-22,8,17);ctx.fillRect(-23,12,8,17);
 ctx.fillRect(15,12,8,17);
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(-17,-34,34,68,8);ctx.fill();
 ctx.fillStyle='#a9dce8';ctx.fillRect(-12,-21,24,19);
 ctx.fillStyle='#294554';ctx.fillRect(-12,5,24,15);
 ctx.fillStyle='#ffe49a';ctx.fillRect(-13,27,7,4);
 ctx.fillRect(6,27,7,4);
 ctx.restore();
}
function draw(){
 ctx.fillStyle='#254237';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#343b42';ctx.fillRect(35,0,320,H);
 ctx.fillStyle='#eee';ctx.fillRect(36,0,3,H);
 ctx.fillRect(352,0,3,H);
 ctx.fillStyle='#ddd';
 for(let y=-55+road%76;y<H;y+=76){
 ctx.fillRect(142,y,4,40);ctx.fillRect(246,y,4,40);
 }
 obstacles.forEach(o=>car(lanes[o.lane],o.y,o.color));
 if(running)car(lanes[lane],455,'#168de0');
 particles.forEach(p=>{
 ctx.globalAlpha=Math.max(0,p.life/35);
 ctx.fillStyle=p.color;ctx.beginPath();
 ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 ctx.globalAlpha=1;
 });
}
function spawn(){
 let available=[0,1,2].filter(l=>
 !obstacles.some(o=>o.lane===l&&o.y<135));
 if(!available.length)return;
 let l=available[Math.floor(Math.random()*available.length)];
 obstacles.push({lane:l,y:-65,
 color:['#f0a33c','#ba75df','#4ebc91','#e85d59'][Math.floor(Math.random()*4)]});
}
function crash(){
 running=false;
 for(let i=0;i<55;i++)particles.push({
 x:lanes[lane],y:455,vx:(Math.random()-.5)*9,
 vy:(Math.random()-.7)*9,life:35,r:3+Math.random()*5,
 color:['#ff4c16','#ffb52e','#ffe46b'][Math.floor(Math.random()*3)]
 });
 draw();
 document.getElementById('overlay').style.display='flex';
 document.querySelector('.overlay h1').textContent='💥 TABRAKAN!';
 document.querySelector('.overlay p').textContent='Skor: '+Math.floor(score);
 document.getElementById('start').textContent='MAIN LAGI';
}
function update(t){
 if(!running)return;
 let dt=Math.min((t-last)/16.67||1,2);last=t;
 score+=dt*.12;
 speed=3.2+Math.min(7.8,score/38);
 road=(road+speed*dt)%76;
 frame+=dt;
 if(frame>Math.max(25,72-speed*3.4)){spawn();frame=0}
 obstacles.forEach(o=>o.y+=speed*dt);
 obstacles=obstacles.filter(o=>o.y<H+80);
 particles.forEach(p=>{
 p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.15*dt;p.life-=dt;
 });
 particles=particles.filter(p=>p.life>0);
 document.getElementById('score').textContent=Math.floor(score);
 document.getElementById('speed').textContent='SPEED '+(speed/3.2).toFixed(1)+'x';
 if(obstacles.some(o=>o.lane===lane&&Math.abs(o.y-455)<53)){
 crash();return;
 }
 draw();raf=requestAnimationFrame(update);
}
function move(d){
 if(!running)return;
 lane=Math.max(0,Math.min(2,lane+d));draw();
}
function start(){
 cancelAnimationFrame(raf);
 running=true;score=0;speed=3.2;lane=1;
 frame=0;road=0;obstacles=[];particles=[];
 document.getElementById('score').textContent='0';
 document.getElementById('speed').textContent='SPEED 1.0x';
 document.getElementById('overlay').style.display='none';
 last=performance.now();draw();raf=requestAnimationFrame(update);
}
document.getElementById('start').onclick=start;
document.getElementById('left').onpointerdown=e=>{e.preventDefault();move(-1)};
document.getElementById('right').onpointerdown=e=>{e.preventDefault();move(1)};
let sx=null;
c.onpointerdown=e=>{sx=e.clientX;c.setPointerCapture(e.pointerId)};
c.onpointerup=e=>{
 if(sx!==null){
 let dx=e.clientX-sx;
 if(Math.abs(dx)>12)move(dx>0?1:-1);
 sx=null;
 }
};
window.onkeydown=e=>{
 if(e.key==='ArrowLeft')move(-1);
 if(e.key==='ArrowRight')move(1);
};
draw();
</script>
</body>
  </html>
