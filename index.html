
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>HIGHWAY RUSH HD</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}

button {
  border: 0;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  touch-action: manipulation;
}

.screen {
  position: fixed;
  inset: 0;
  display: none;
  overflow: hidden;
}

.screen.active {
  display: flex;
}

/* INTRO */

#introScreen {
  z-index: 20;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: radial-gradient(circle, #26364e, #080b12 70%);
}

.intro-title {
  font-size: clamp(40px, 12vw, 68px);
  font-weight: 1000;
  letter-spacing: 5px;
  text-shadow: 0 0 25px #ff762c;
}

.intro-title span {
  display: inline-block;
  opacity: 0;
  animation: letterIn .4s forwards;
}

@keyframes letterIn {
  from { opacity: 0; transform: translateY(25px) scale(.7); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.presents {
  margin-top: 15px;
  color: #ff792d;
  letter-spacing: 8px;
  font-size: 13px;
  opacity: 0;
  animation: presentIn .8s 1.2s forwards;
}

@keyframes presentIn {
  to { opacity: 1; letter-spacing: 5px; }
}

.loading {
  width: 190px;
  height: 5px;
  margin-top: 35px;
  border-radius: 10px;
  overflow: hidden;
  background: #303b4c;
}

.loading div {
  height: 100%;
  width: 0;
  background: #ff792d;
  animation: load 2.5s linear forwards;
}

@keyframes load {
  to { width: 100%; }
}

/* MENU */

#menuScreen {
  z-index: 2;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 22px;
  background:
    radial-gradient(circle at 50% 20%, #344961, transparent 55%),
    linear-gradient(#111b29, #080b12);
}

.menu-road {
  position: absolute;
  width: 190px;
  height: 120%;
  top: -10%;
  left: 50%;
  transform: translateX(-50%);
  background: #1a222e;
  border-left: 5px solid #ff762c;
  border-right: 5px solid #ff762c;
  opacity: .4;
}

.menu-road::before,
.menu-road::after {
  content: "";
  position: absolute;
  top: 0;
  height: 100%;
  width: 4px;
  background: repeating-linear-gradient(
    to bottom, white 0 45px, transparent 45px 90px
  );
}

.menu-road::before { left: 33%; }
.menu-road::after { right: 33%; }

.menu-content {
  z-index: 2;
  width: min(100%, 340px);
  text-align: center;
}

.logo {
  font-size: clamp(38px, 11vw, 60px);
  font-weight: 1000;
  font-style: italic;
  line-height: .9;
  text-shadow: 4px 4px 0 #a83c0d;
}

.logo span { color: #ff792d; }

.subtitle {
  color: #aeb9c9;
  font-size: 10px;
  letter-spacing: 5px;
  margin: 15px 0 35px;
}

.menu-btn {
  display: block;
  width: 100%;
  padding: 16px;
  margin: 11px 0;
  border-radius: 9px;
  background: #202d40;
  border: 1px solid #465970;
  transition: transform .15s, background .15s;
}

.menu-btn:active {
  transform: scale(.96);
}

.menu-btn.primary {
  background: #ff7027;
  border-color: #ff9a5f;
  box-shadow: 0 5px 25px #ff702744;
}

.menu-footer {
  color: #778397;
  font-size: 10px;
  margin-top: 30px;
  letter-spacing: 2px;
}

/* PANELS */

#highScoreScreen,
#settingsScreen,
#pauseScreen,
#gameOverScreen,
#finishScreen {
  z-index: 10;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 22px;
  background: #080d16f5;
  text-align: center;
}

.panel {
  width: min(100%, 340px);
  padding: 25px 20px;
  border-radius: 16px;
  background: #141e2d;
  border: 1px solid #40516a;
  box-shadow: 0 15px 50px #0008;
}

.panel h1 {
  color: #ff792d;
  margin-top: 0;
}

.big-score {
  font-size: 48px;
  font-weight: 1000;
  margin: 20px 0;
}

.small-text {
  color: #a8b5c7;
  font-size: 12px;
  line-height: 1.6;
}

/* GAME */

#gameScreen {
  z-index: 3;
  background: #101722;
}

#gameCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

.hud {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 3;
  pointer-events: none;
}

.hud-box {
  background: #080b12dd;
  border: 1px solid #ffffff33;
  border-radius: 9px;
  padding: 8px 12px;
  min-width: 85px;
}

.hud-label {
  color: #a5b1c2;
  font-size: 9px;
  letter-spacing: 2px;
}

.hud-value {
  font-size: 21px;
  font-weight: 900;
  margin-top: 3px;
}

#pauseButton {
  pointer-events: auto;
  background: #182538ed;
  border: 1px solid #ffffff44;
  border-radius: 9px;
  padding: 12px 16px;
}

.skills {
  position: absolute;
  top: 88px;
  left: 9px;
  right: 9px;
  display: flex;
  justify-content: center;
  gap: 7px;
  z-index: 3;
}

.skill-btn {
  flex: 1;
  max-width: 115px;
  min-height: 46px;
  background: #121d2cdd;
  border: 1px solid #53647a;
  border-radius: 8px;
  font-size: 10px;
  padding: 6px 2px;
}

.skill-btn:disabled { opacity: .35; }

.skill-btn.ready {
  border-color: #ff792d;
  color: #ff9b60;
}

.skill-status {
  position: absolute;
  top: 142px;
  width: 100%;
  text-align: center;
  color: #ffb27f;
  font-size: 11px;
  font-weight: bold;
  text-shadow: 0 2px 4px black;
  z-index: 3;
}

.controls {
  position: absolute;
  bottom: 22px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  padding: 0 25px;
  z-index: 3;
}

.control-btn {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #101b2bdd;
  border: 2px solid #ffffff66;
  font-size: 25px;
  box-shadow: 0 5px 20px #0008;
}

.control-btn:active { background: #ff7027; }

#speedBar {
  position: absolute;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  width: 115px;
  height: 5px;
  background: #ffffff33;
  border-radius: 10px;
  overflow: hidden;
}

#speedFill {
  height: 100%;
  width: 20%;
  background: #ff792d;
}

.hidden { display: none !important; }

#finishScreen h1 {
  font-size: 38px;
  color: #ff792d;
}
</style>
</head>

<body>

<section id="introScreen" class="screen active">
  <div class="intro-title" id="introTitle"></div>
  <div class="presents">P R E S E N T S</div>
  <div class="loading"><div></div></div>
</section>

<section id="menuScreen" class="screen">
  <div class="menu-road"></div>
  <div class="menu-content">
    <div class="logo">HIGHWAY<br><span>RUSH</span></div>
    <div class="subtitle">ENDLESS ROAD EXPERIENCE</div>
    <button class="menu-btn primary" id="playButton">▶ PLAY GAME</button>
    <button class="menu-btn" id="scoreButton">🏆 HIGH SCORE</button>
    <button class="menu-btn" id="settingsButton">⚙ SETTINGS</button>
    <div class="menu-footer">ADIT ® ORIGINAL GAME</div>
  </div>
</section>

<section id="highScoreScreen" class="screen">
  <div class="panel">
    <h1>HIGH SCORE</h1>
    <div class="big-score" id="bestScoreDisplay">0</div>
    <p class="small-text">REKOR TERBAIK DI PERANGKAT INI</p>
    <button class="menu-btn primary" id="scoreBackButton">BACK TO MENU</button>
  </div>
</section>

<section id="settingsScreen" class="screen">
  <div class="panel">
    <h1>SETTINGS</h1>
    <p class="small-text">AUDIO</p>
    <button class="menu-btn" id="soundButton">SOUND: ON</button>
    <button class="menu-btn" id="musicButton">MUSIC: ON</button>
    <button class="menu-btn primary" id="settingsBackButton">BACK TO MENU</button>
  </div>
</section>

<section id="gameScreen" class="screen">
  <canvas id="gameCanvas"></canvas>

  <div class="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="scoreDisplay">0</div>
    </div>
    <button id="pauseButton">Ⅱ</button>
    <div class="hud-box">
      <div class="hud-label">SPEED</div>
      <div class="hud-value" id="speedDisplay">1x</div>
    </div>
  </div>

  <div class="skills">
    <button class="skill-btn" id="megaSkill" disabled>🚘<br>MEGA CAR</button>
    <button class="skill-btn" id="flySkill" disabled>✈️<br>FLY</button>
    <button class="skill-btn" id="slowSkill" disabled>⏳<br>SLOW TIME</button>
  </div>

  <div class="skill-status" id="skillStatus">SKILL TERBUKA DI SKOR 150</div>
  <div id="speedBar"><div id="speedFill"></div></div>

  <div class="controls">
    <button class="control-btn" id="leftButton">◀</button>
    <button class="control-btn" id="rightButton">▶</button>
  </div>
</section>

<section id="pauseScreen" class="screen">
  <div class="panel">
    <h1>PAUSED</h1>
    <p class="small-text">GAME SEDANG DIJEDA</p>
    <button class="menu-btn primary" id="resumeButton">▶ RESUME</button>
    <button class="menu-btn" id="restartPauseButton">↻ RESTART</button>
    <button class="menu-btn" id="menuPauseButton">MAIN MENU</button>
  </div>
</section>

<section id="gameOverScreen" class="screen">
  <div class="panel">
    <h1>GAME OVER</h1>
    <div class="big-score" id="finalScore">0</div>
    <p class="small-text">SKOR AKHIR</p>
    <button class="menu-btn primary" id="retryButton">↻ TRY AGAIN</button>
    <button class="menu-btn" id="menuOverButton">MAIN MENU</button>
  </div>
</section>

<section id="finishScreen" class="screen">
  <div class="panel">
    <h1>🏁 FINISH!</h1>
    <div class="big-score">1000</div>
    <p class="small-text">KAMU BERHASIL MENYELESAIKAN HIGHWAY RUSH!</p>
    <div style="font-size:55px;margin:15px">😎</div>
    <button class="menu-btn primary" id="finishMenuButton">BACK TO MENU</button>
  </div>
</section>

<script>
"use strict";

/* SCREEN SYSTEM */

const $ = id => document.getElementById(id);
const screens = document.querySelectorAll(".screen");

function showScreen(id) {
  screens.forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
}

/* INTRO SYSTEM */

const introText = "ADIT ®";

introText.split("").forEach((letter, index) => {
  const span = document.createElement("span");
  span.textContent = letter === " " ? "\u00a0" : letter;
  span.style.animationDelay = (index * 0.16) + "s";
  $("introTitle").appendChild(span);
});

let introFinished = false;

function finishIntro() {
  if (introFinished) return;
  introFinished = true;
  showScreen("menuScreen");
}

window.addEventListener("load", () => {
  setTimeout(finishIntro, 3800);
});

/* AUDIO SYSTEM */

let audioContext = null;
let soundEnabled = true;
let musicEnabled = true;
let musicTimer = null;
let musicStep = 0;

const musicNotes = [220, 261, 329, 261, 196, 246, 293, 246];

function initAudio() {
  if (!audioContext) {
    const AudioClass = window.AudioContext || window.webkitAudioContext;
    if (AudioClass) audioContext = new AudioClass();
  }

  if (audioContext && audioContext.state === "suspended") {
    audioContext.resume().catch(() => {});
  }
}

function tone(freq, duration, type = "sine", volume = .04) {
  if (!soundEnabled || !audioContext) return;

  const osc = audioContext.createOscillator();
  const gain = audioContext.createGain();

  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioContext.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  osc.stop(audioContext.currentTime + duration);
}

function playSound(type) {
  initAudio();
  if (!soundEnabled) return;

  if (type === "click") tone(520, .08, "square", .025);
  if (type === "start") {
    tone(330, .12);
    setTimeout(() => tone(520, .16), 120);
  }
  if (type === "lane") tone(260, .06, "sine", .02);
  if (type === "skill") {
    tone(440, .12, "triangle");
    setTimeout(() => tone(700, .18, "triangle"), 100);
  }
  if (type === "crash") tone(110, .35, "sawtooth", .06);
  if (type === "pause") tone(220, .1);
  if (type === "finish") {
    tone(440, .15);
    setTimeout(() => tone(550, .15), 150);
    setTimeout(() => tone(660, .3), 300);
  }
}

function startMusic() {
  if (!musicEnabled || musicTimer) return;
  initAudio();
  if (!audioContext) return;

  musicTimer = setInterval(() => {
    if (!musicEnabled || audioContext.state !== "running") return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "triangle";
    osc.frequency.value = musicNotes[musicStep % musicNotes.length];
    musicStep++;

    gain.gain.value = .018;
    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start();

    gain.gain.exponentialRampToValueAtTime(
      .001,
      audioContext.currentTime + .25
    );
    osc.stop(audioContext.currentTime + .25);
  }, 300);
}

function stopMusic() {
  if (musicTimer) clearInterval(musicTimer);
  musicTimer = null;
}

/* SETTINGS */

function updateSettings() {
  $("soundButton").textContent = "SOUND: " + (soundEnabled ? "ON" : "OFF");
  $("musicButton").textContent = "MUSIC: " + (musicEnabled ? "ON" : "OFF");
}

$("soundButton").onclick = () => {
  soundEnabled = !soundEnabled;
  updateSettings();
  if (soundEnabled) playSound("click");
};

$("musicButton").onclick = () => {
  musicEnabled = !musicEnabled;
  if (musicEnabled) startMusic();
  else stopMusic();
  updateSettings();
};

/* HIGH SCORE */

let bestScore = 0;

try {
  bestScore = Number(localStorage.getItem("hrBest") || 0);
} catch (e) {}

function saveBestScore() {
  if (score > bestScore) {
    bestScore = score;
    try {
      localStorage.setItem("hrBest", String(bestScore));
    } catch (e) {}
  }

  $("bestScoreDisplay").textContent = bestScore;
}

/* CANVAS */

const canvas = $("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;

  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = rect.width;
  H = rect.height;

  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resizeCanvas);

/* GAME VARIABLES */

let running = false;
let paused = false;
let score = 0;
let speed = 1;
let roadOffset = 0;
let spawnTimer = 0;
let lastFrame = 0;
let animationFrame = null;

let player = { lane: 1, y: 0, width: 38, height: 65 };

let obstacles = [];
let trees = [];

function roadBounds() {
  const roadWidth = Math.min(W * .72, 420);
  return {
    left: (W - roadWidth) / 2,
    width: roadWidth,
    right: (W + roadWidth) / 2
  };
}

function laneCenter(lane) {
  const road = roadBounds();
  return road.left + road.width * ((lane + .5) / 3);
}

/* SKILLS */

const SKILL_UNLOCK_SCORE = 150;
const SKILL_COOLDOWN = 90;

const skillInfo = {
  mega: { duration: 50, label: "MEGA CAR" },
  fly: { duration: 40, label: "FLY" },
  slow: { duration: 60, label: "SLOW TIME" }
};

let activeSkill = null;
let skillEndTime = 0;
let cooldownEndTime = 0;

const skillButtons = {
  mega: $("megaSkill"),
  fly: $("flySkill"),
  slow: $("slowSkill")
};

function activateSkill(type) {
  if (!running || paused) return;
  if (score < SKILL_UNLOCK_SCORE) return;
  if (activeSkill || Date.now() < cooldownEndTime) return;

  activeSkill = type;
  skillEndTime = Date.now() + skillInfo[type].duration * 1000;
  playSound("skill");
  updateSkillUI();
}

function endSkill() {
  if (!activeSkill) return;
  activeSkill = null;
  cooldownEndTime = Date.now() + SKILL_COOLDOWN * 1000;
  updateSkillUI();
}

function updateSkillUI() {
  const status = $("skillStatus");
  const unlocked = score >= SKILL_UNLOCK_SCORE;
  const cooling = Date.now() < cooldownEndTime;

  Object.keys(skillButtons).forEach(type => {
    const button = skillButtons[type];
    const active = activeSkill === type;

    button.disabled = !unlocked || !!activeSkill || cooling;
    button.classList.toggle("ready", unlocked && !activeSkill && !cooling);

    const icons = { mega: "🚘", fly: "✈️", slow: "⏳" };

    button.innerHTML = active
      ? skillInfo[type].label + "<br>ACTIVE"
      : icons[type] + "<br>" + skillInfo[type].label;
  });

  if (!unlocked) {
    status.textContent = "SKILL TERBUKA DI SKOR 150";
  } else if (activeSkill) {
    const remaining = Math.max(0, Math.ceil((skillEndTime - Date.now()) / 1000));
    status.textContent = skillInfo[activeSkill].label + " • " + remaining + "s";
  } else if (cooling) {
    const remaining = Math.ceil((cooldownEndTime - Date.now()) / 1000);
    status.textContent = "COOLDOWN • " + remaining + "s";
  } else {
    status.textContent = "SKILLS READY";
  }
}

skillButtons.mega.onclick = () => activateSkill("mega");
skillButtons.fly.onclick = () => activateSkill("fly");
skillButtons.slow.onclick = () => activateSkill("slow");

/* DRAWING */

function drawCar(x, y, color, isPlayer = false) {
  let width = isPlayer ? 38 : 34;
  let height = isPlayer ? 65 : 56;

  if (isPlayer && activeSkill === "mega") {
    width = 48;
    height = 72;
  }

  if (isPlayer && activeSkill === "fly") y -= 35;

  ctx.save();

  if (isPlayer && activeSkill === "fly") {
    ctx.shadowColor = "#54d9ff";
    ctx.shadowBlur = 20;
  }

  ctx.fillStyle = "#08090b";
  ctx.fillRect(x - width / 2 - 4, y + 9, 5, height - 16);
  ctx.fillRect(x + width / 2 - 1, y + 9, 5, height - 16);

  ctx.fillStyle = "#090b10";
  ctx.fillRect(x - width / 2 + 3, y + height - 8, width - 6, 5);

  ctx.fillStyle = color;
  ctx.fillRect(x - width / 2, y, width, height);

  ctx.fillStyle = "#b7d8ed";
  ctx.fillRect(x - width / 2 + 5, y + 9, width - 10, 13);

  ctx.fillStyle = "#111820";
  ctx.fillRect(x - width / 2 + 5, y + 29, width - 10, 14);

  ctx.fillStyle = "#ffdf75";
  ctx.fillRect(x - width / 2 + 4, y + height - 7, 7, 4);
  ctx.fillRect(x + width / 2 - 11, y + height - 7, 7, 4);

  if (isPlayer && activeSkill === "mega") {
    ctx.strokeStyle = "#ff9500";
    ctx.lineWidth = 3;
    ctx.strokeRect(x - width / 2 - 4, y - 4, width + 8, height + 8);
  }

  ctx.restore();
}

function drawTree(x, y, size) {
  ctx.fillStyle = "#50351f";
  ctx.fillRect(x - size * .12, y, size * .24, size * .7);

  ctx.fillStyle = "#1e6738";
  ctx.beginPath();
  ctx.arc(x, y, size * .48, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#2d8b49";
  ctx.beginPath();
  ctx.arc(x - size * .15, y - size * .12, size * .28, 0, Math.PI * 2);
  ctx.fill();
}

function drawRoad(delta) {
  const road = roadBounds();

  ctx.fillStyle = "#15291d";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#282e38";
  ctx.fillRect(road.left, 0, road.width, H);

  ctx.fillStyle = "#ff762c";
  ctx.fillRect(road.left - 4, 0, 4, H);
  ctx.fillRect(road.right, 0, 4, H);

  roadOffset += delta * speed * 0.32;
  ctx.fillStyle = "#dce0e6";

  for (let i = 1; i <= 2; i++) {
    const x = road.left + road.width * i / 3;

    for (let y = -70 + roadOffset % 70; y < H; y += 70) {
      ctx.fillRect(x - 2, y, 4, 35);
    }
  }

  ctx.fillStyle = "#1b3525";

  for (let y = -40 + roadOffset % 80; y < H; y += 80) {
    ctx.fillRect(0, y, road.left - 5, 3);
    ctx.fillRect(road.right + 5, y, W - road.right, 3);
  }
}

function drawScene(delta) {
  if (!W || !H) return;

  drawRoad(delta);

  trees.forEach(tree => {
    drawTree(tree.x, tree.y, tree.size);
  });

  obstacles.forEach(obstacle => {
    drawCar(
      laneCenter(obstacle.lane),
      obstacle.y,
      obstacle.color,
      false
    );
  });

  const playerY = H - 135;
  player.y = playerY;

  drawCar(
    laneCenter(player.lane),
    playerY,
    "#ff7027",
    true
  );
}

/* GAME FLOW */

function updateHUD() {
  $("scoreDisplay").textContent = Math.floor(score);
  $("speedDisplay").textContent = speed.toFixed(1) + "x";
  $("speedFill").style.width = Math.min(100, speed * 25) + "%";
  updateSkillUI();
}

function startGame() {
  stopMusic();

  score = 0;
  speed = 1;
  roadOffset = 0;
  spawnTimer = 0;
